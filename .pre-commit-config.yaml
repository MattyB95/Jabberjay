repos:
  - repo: local
    hooks:
      - id: sync-version
        name: Sync version to CITATION.cff and README.md
        language: python
        entry: python scripts/sync_version.py
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        exclude: mkdocs\.yml
      - id: check-json
      - id: check-toml
      - id: detect-private-key

  # Run through uv so the hooks use exactly the versions locked in uv.lock
  # (and bumped by Dependabot) instead of a separately pinned `rev` that drifts
  - repo: local
    hooks:
      - id: black
        name: Format with black
        language: system
        entry: uv run black
        types_or: [python, pyi]

      - id: ruff-check
        name: Lint with ruff
        language: system
        entry: uv run ruff check --fix
        types_or: [python, pyi]

      - id: ty-check
        name: Type-check with ty
        language: system
        entry: uv run ty check
        pass_filenames: false
