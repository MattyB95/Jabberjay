[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Jabberjay"
version = "0.0.15"
description = "🦜 Synthetic Voice Detection"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    { name = "Matthew Boakes", email = "Matthew.Boakes@Gmail.com" },
]
keywords = [
    "synthetic voice detection",
    "deepfake detection",
    "anti-spoofing",
    "audio classification",
    "speech",
    "ASVspoof",
    "bonafide",
    "spoof",
    "transformers",
    "ViT",
    "HuBERT",
    "Wav2Vec2",
    "WavLM",
    "RawNet2",
    "machine learning",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Security",
]
dependencies = [
    "huggingface-hub>=1.31.0",
    "joblib>=1.6.0",
    "loguru>=0.7.3",
    "librosa>=1.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3,<3",
    "pillow>=12.3.0",
    "PyYAML>=6.0.3",
    "scikit-learn>=1.9.0",
    "soundfile>=0.14.0",
    "torch>=2.14.0,<3",
    "torchaudio>=2.11.0,<3",
    "transformers>=5.17.0",
]

[project.urls]
"Homepage" = "https://github.com/MattyB95/Jabberjay"
"Bug Tracker" = "https://github.com/MattyB95/Jabberjay/issues"
"Changelog" = "https://github.com/MattyB95/Jabberjay/blob/main/CHANGELOG.md"
"Source" = "https://github.com/MattyB95/Jabberjay"

[project.scripts]
jabberjay = "Jabberjay.jabberjay:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
addopts = "--cov=src/Jabberjay --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    # Classical model .joblib was pickled with sklearn 1.3.0; loads and runs
    # correctly on 1.9.0 — KNeighborsClassifier is stable across this range
    "ignore::sklearn.exceptions.InconsistentVersionWarning",
]

[tool.coverage.run]
source = ["src/Jabberjay"]
omit = [
    "*/__pycache__/*",
    "*/Models/RawNet2/model.py",  # third-party neural network architecture
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ["py312", "py313", "py314"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E4/E7/E9 and F are safe alongside black; I adds isort; avoid E1-E3/W which overlap with black
# UP (pyupgrade), B (bugbear), SIM (simplify), and RUF are formatting-neutral —
# they flag real bugs and outdated syntax without fighting black
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Third-party neural network architecture (see coverage.omit) — left as close
# to upstream as possible rather than modernised, to ease future diffing
"src/Jabberjay/Models/RawNet2/model.py" = ["UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"

[tool.hatch.build.targets.wheel]
packages = ["src/Jabberjay"]
