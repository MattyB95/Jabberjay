# CI / CD pipeline
#
# Branches
# --------
# develop  → lint + test + publish a pre-release (.devN) to TestPyPI
# main     → lint + test + publish the release version to PyPI
#
# Required GitHub secrets
# -----------------------
# TEST_PYPI_API_TOKEN  – token from https://test.pypi.org/manage/account/token/
# PYPI_API_TOKEN       – token from https://pypi.org/manage/account/token/
#
# Version strategy
# ----------------
# Bump `version` in pyproject.toml before merging to main.
# Each push to develop auto-appends .dev<RUN_NUMBER> so TestPyPI always
# receives a unique, sortable pre-release (e.g. 0.1.0.dev42).

name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A newer push to a pull request supersedes its in-flight run. Pushes to
# main/develop each get a group of their own (keyed by run id): a shared group
# holds only one pending run, so a burst of pushes would silently drop the
# middle ones, leaving those commits untested and unpublished.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Lint & type-check ──────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked --group dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with black
        run: uv run black --check .

      - name: Type-check with ty
        run: uv run ty check

      - name: Audit dependencies for known vulnerabilities
        run: uv audit

  # ── Test matrix ────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Test with pytest
        run: uv run pytest  # enforces 100% coverage via pyproject addopts

      - name: Upload coverage report
        if: matrix.python-version == '3.15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ── Publish pre-release to TestPyPI (develop only) ────────────────────────
  publish-test:
    name: Publish to TestPyPI
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publisher authentication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Inject .devN version suffix
        run: |
          CURRENT=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          DEV="${CURRENT}.dev${GITHUB_RUN_NUMBER}"
          sed -i "s/version = \"${CURRENT}\"/version = \"${DEV}\"/" pyproject.toml
          echo "Publishing version: ${DEV}"

      - name: Build package
        run: uv build

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/

  # ── Publish release to PyPI (main only) ───────────────────────────────────
  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publisher authentication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
