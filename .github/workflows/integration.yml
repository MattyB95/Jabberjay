# Integration smoke test
#
# Runs the full model sweep (examples/run_all.py) end-to-end against a real
# audio clip, downloading every model from HuggingFace Hub, then the
# `pytest -m integration` tests against those cached weights. The unit test
# suite mocks all model loading, so this is the only check that catches a
# genuine upstream API break (torch, transformers, librosa, torchaudio).
#
# Not part of the PR gate — it is slow and depends on external services.
# Runs weekly and on manual dispatch.

name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  smoke:
    name: Full model sweep
    runs-on: ubuntu-latest
    # A cold run (every model downloaded) took under 7 min on 0.2.0 (#92)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Cache HuggingFace Hub downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          # Every downloaded revision is pinned in this one file
          key: hf-hub-${{ hashFiles('src/Jabberjay/Utilities/hugging_face.py') }}
          restore-keys: hf-hub-

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run full model sweep
        run: uv run python examples/run_all.py

      # After the sweep, so every checkpoint is already cached
      - name: Run integration tests
        env:
          JABBERJAY_REQUIRE_WEIGHTS: "1"
        run: uv run pytest -m integration --no-cov -rs
